name: Web CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: chatlyzer
          POSTGRES_PASSWORD: ci-password
          POSTGRES_DB: chatlyzer_test
        ports: [5432:5432]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    # Test-only credentials. CI never receives production secrets.
    env:
      DATABASE_URL: postgresql://chatlyzer:ci-password@localhost:5432/chatlyzer_test
      JWT_SECRET: ci-jwt-secret-never-use-in-production
      REFRESH_TOKEN_SECRET: ci-refresh-secret-never-use-in-production
      OPENAI_API_KEY: ci-mocked-openai
      NEXT_PUBLIC_GOOGLE_CLIENT_ID: ci.apps.googleusercontent.com
      REVENUECAT_SECRET_API_KEY: ci-mocked-revenuecat
      REVENUECAT_WEBHOOK_SECRET: ci-webhook-authorization-8779f5f01d78186632329d472d676edf
      NEXT_PUBLIC_REVENUECAT_WEB_API_KEY: ci-web-api-key
      NEXT_PUBLIC_POSTHOG_KEY: ""
      REVENUECAT_FULFILLMENT_MODE: sandbox
      TRUSTED_CLIENT_IP_HEADER: none
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: npm
      - name: Setup Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: "2.9.5"
      - run: npm ci
      - run: npx prisma validate
      - run: npx prisma migrate deploy
      - run: npm run check:schema
      - run: npm run test:migrations
      - name: Compare mobile contract surface
        run: |
          git clone --depth 1 https://github.com/yigitml/chatlyzer-mobile.git /tmp/chatlyzer-mobile
          CHATLYZER_MOBILE_ROOT=/tmp/chatlyzer-mobile npm run check:contracts
      - run: npm run check:env:production
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:integration
      - run: npm run build
      - name: HTTP smoke test of production server
        run: |
          npm run start:cloud > /tmp/chatlyzer-server.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3000/api/health; then break; fi
            sleep 2
          done
          node scripts/smoke-test.mjs http://localhost:3000
      - name: HTTP smoke test under Deno
        run: |
          PORT=3001 HOSTNAME=127.0.0.1 deno run -A --unstable-cron .next/standalone/server.js > /tmp/chatlyzer-deno.log 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/health; then break; fi
            sleep 2
          done
          node scripts/smoke-test.mjs http://127.0.0.1:3001
