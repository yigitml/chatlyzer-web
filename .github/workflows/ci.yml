name: Web CI

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: package-lock.json

      - name: Create CI env file
        shell: bash
        run: |
          set -e
          if [ -n "${{ secrets.PROD_ENV_FILE }}" ]; then
            cat > .env <<'EOF'
          ${{ secrets.PROD_ENV_FILE }}
          EOF
          else
            cat > .env <<'EOF'
          DATABASE_URL="postgresql://ci:ci@localhost:5432/chatlyzer_ci"
          JWT_SECRET="ci-jwt-secret"
          REFRESH_TOKEN_SECRET="ci-refresh-token-secret"
          OPENAI_API_KEY="ci-openai-key"
          GOOGLE_OAUTH2_URL="https://www.googleapis.com/oauth2/v3"
          REVENUECAT_WEBHOOK_SECRET="ci-revenuecat-webhook-secret"
          NEXT_PUBLIC_GOOGLE_CLIENT_ID="ci-google-client-id.apps.googleusercontent.com"
          NEXT_PUBLIC_POSTHOG_KEY=""
          NEXT_PUBLIC_POSTHOG_HOST="https://us.i.posthog.com"
          EOF
          fi
          if ! grep -q '^REVENUECAT_WEBHOOK_SECRET=' .env; then
            echo 'REVENUECAT_WEBHOOK_SECRET="ci-revenuecat-webhook-secret"' >> .env
          fi
          test -s .env
          grep -q '^DATABASE_URL=' .env
          grep -q '^REVENUECAT_WEBHOOK_SECRET=' .env

      - name: Install dependencies
        run: npm ci

      - name: Validate Prisma schema
        run: npx prisma validate

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
