# Deploy this repository as a Render Blueprint. External provider credentials
# are entered in Render, never committed. See docs/cloud-deployment.md.
services:
  - type: web
    name: chatlyzer-web
    runtime: node
    region: frankfurt
    plan: 0.5c-512mb
    buildCommand: npm ci --include=dev && npm run check:env:production && npm run build
    preDeployCommand: npx prisma migrate deploy
    startCommand: npm run start:cloud
    maxShutdownDelaySeconds: 300
    healthCheckPath: /api/health
    autoDeployTrigger: checksPass
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      - key: NEXT_TELEMETRY_DISABLED
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: chatlyzer-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: REFRESH_TOKEN_SECRET
        generateValue: true
      - key: OPENAI_API_KEY
        sync: false
      - key: NEXT_PUBLIC_GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_OAUTH2_URL
        value: https://www.googleapis.com/oauth2/v3
      - key: NEXT_PUBLIC_REVENUECAT_WEB_API_KEY
        sync: false
      - key: REVENUECAT_SECRET_API_KEY
        sync: false
      - key: REVENUECAT_WEBHOOK_SECRET
        generateValue: true
      - key: REVENUECAT_CREDITS_PRODUCT_ID
        value: credits_24
      - key: NEXT_PUBLIC_REVENUECAT_CREDITS_PRODUCT_ID
        value: credits_24
      - key: REVENUECAT_CREDITS_PER_PURCHASE
        value: "24"
      - key: NEXT_PUBLIC_POSTHOG_HOST
        value: https://us.i.posthog.com

databases:
  - name: chatlyzer-db
    region: frankfurt
    plan: 0.1c-256mb
    diskSizeGB: 1
    databaseName: chatlyzer
    user: chatlyzer
    postgresMajorVersion: "17"
    ipAllowList: []
